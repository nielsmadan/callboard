pre-commit:
  parallel: true
  commands:
    ruff-format:
      glob: "*.py"
      run: uv run --locked ruff format --check {staged_files}
    ruff-lint:
      glob: "*.py"
      run: uv run --locked ruff check {staged_files}
    swift:
      root: "app/"
      glob: "*.swift"
      run: just format {staged_files} && just lint-fix {staged_files} && just lint {staged_files}
      stage_fixed: true

pre-push:
  piped: true
  commands:
    check-static:
      run: just check-static
      priority: 1
    coverage:
      run: just coverage
      priority: 2
    app-check:
      glob: "app/**"
      run: just app check
      priority: 3
