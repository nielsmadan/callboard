[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "callboard"
version = "0.1.0"
description = "Chat, mail and pings between coding agents, rung through bellhop."
readme = "README.md"
requires-python = ">=3.13"
license = "MIT"
authors = [{ name = "Niels Madan" }]
dependencies = []
keywords = ["agents", "cli", "coding-agents", "messaging"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Environment :: Console",
    "License :: OSI Approved :: MIT License",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3.13",
    "Topic :: Communications :: Chat",
]

[project.urls]
Homepage = "https://github.com/nielsmadan/callboard"
Repository = "https://github.com/nielsmadan/callboard"
Issues = "https://github.com/nielsmadan/callboard/issues"

[project.scripts]
callboard = "callboard.cli:main"

[dependency-groups]
dev = ["pytest>=9.1.1", "pytest-cov>=5", "ruff>=0.16.1", "pylint>=4.0.7", "mypy>=2.3.0"]

[tool.coverage.run]
source = ["callboard"]
branch = true
omit = ["*/__main__.py"]

[tool.coverage.report]
show_missing = true
fail_under = 80

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-config --strict-markers -m 'not smoke'"
markers = ["smoke: live test against real agents; run only through just smoke"]
filterwarnings = ["error"]

[tool.ruff]
target-version = "py313"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
extend-select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM", "PL", "BLE", "S", "SLF", "RUF"]
ignore = ["E501", "S603", "S607"]

[tool.ruff.lint.pylint]
max-returns = 8
max-branches = 15
max-statements = 60
max-args = 6

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "SLF001", "PLR2004"]
"src/callboard/cli/__init__.py" = ["BLE001"]

[tool.pylint."messages control"]
disable = ["all"]
enable = ["cyclic-import"]

[tool.pylint.reports]
score = false

[tool.mypy]
python_version = "3.13"
files = ["src", "tests"]
strict = true

[tool.hatch.build.targets.wheel]
packages = ["src/callboard"]

[tool.hatch.build.targets.sdist]
include = ["src/callboard", "tests", "README.md", "LICENSE", "pyproject.toml"]
